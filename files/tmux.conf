# Screen like binding
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Bigger history
set -g history-limit 50000

# renumber all windows when any window is closed
set -g renumber-windows on

# Ring the bell if any background window rang a bell
set -g bell-action any

# Default termtype. If the rcfile sets $TERM, that overrides this value.
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -ga terminal-features ",xterm-256color:usstyle"

# Use vi keybindings for tmux commandline input.
# Note that to get command mode you need to hit ESC twice...
set -g status-keys vi

# Use vi keybindings in copy and choice modes
setw -g mode-keys vi

set -g status-interval 2

# Allows for faster key repetition
set -s escape-time 0

set -g focus-events on

# Activity monitoring
setw -g monitor-activity off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

bind [ copy-mode

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Bind ']' to use pbpaste
bind ] run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# Grab last AI response (claude/codex), open agent's editor (Ctrl+G), paste from clipboard
bind-key g run-shell -b '~/dotfiles/files/bin/ai-response-to-editor.sh #{pane_id}'

# Scroll the pane to the start of the latest AI response (enters copy-mode)
bind-key a run-shell -b '~/dotfiles/files/bin/ai-scroll-to-last-response.sh #{pane_id}'

# easily toggle synchronization (mnemonic: e is for echo)
# sends input to all panes in a given window.
bind e setw synchronize-panes

# set first window to index 1 (not 0) to map more to the keyboard layout...
set-option -g base-index 1
set-window-option -g pane-base-index 1

# swap window to left or right
bind-key -r < swap-window -d -t -1
bind-key -r > swap-window -d -t +1

# Keep your finger on ctrl, or don't
bind-key ^D detach-client

# Create splits and vertical splits
bind-key v split-window -h
bind-key ^V split-window -h
bind-key s split-window
bind-key ^S split-window

bind-key -n M-[ switch-client -p
bind-key -n M-] switch-client -n

# Jump to the last session
bind-key h switch-client -l

# Pane navigation (C-h/j/k/l) handled by tmux-agent-layout plugin
bind-key -n C-\\ if -F "#{@pane-is-vim}" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-\' select-pane -l

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# clear history
bind-key k send-keys -R \; clear-history \; send-keys "clear" C-m

# force a reload of the config kile
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind-key -n M-2 run-shell -b '\
  tmpfile=/tmp/tmux_fzf_$$.tmp; \
  tmux display-popup -d "#{pane_current_path}" -E \
    "fd -H -L --no-ignore --ignore-file .aiignore --ignore-file .geminiignore -E .git -E node_modules -E target -E dist -E build 2>/dev/null | \
     sed \"s|^\\./||\" | \
     sort | \
     fzf --reverse --exit-0 --sync > $tmpfile"; \
  [ -s "$tmpfile" ] && tmux send-keys -t "#{pane_id}" -l "@$(cat $tmpfile) "; \
  rm -f "$tmpfile"'

bind-key -n M-3 run-shell -b '\
  tmpfile=/tmp/tmux_draw_prompt_$$.tmp; \
  "$HOME/projects/github/accessd/draw-prompt/bin/draw-prompt" > "$tmpfile"; \
  [ -s "$tmpfile" ] && tmux send-keys -t "#{pane_id}" -l "@$(cat "$tmpfile") "; \
  rm -f "$tmpfile"'

bind-key -n M-4 run-shell -b '\
  tmpfile=/tmp/tmux_draw_prompt_remote_$$.tmp; \
  "$HOME/projects/github/accessd/draw-prompt/bin/draw-prompt" latest > "$tmpfile"; \
  if [ -s "$tmpfile" ]; then \
    tmux send-keys -t "#{pane_id}" -l "@$(cat "$tmpfile") "; \
  else \
    tmux display-message "draw-prompt: no saved remote image yet"; \
  fi; \
  rm -f "$tmpfile"'

bind-key -n M-5 run-shell -b '\
  tmpfile=/tmp/tmux_draw_prompt_remote_$$.tmp; \
  tmux display-popup -d "#{pane_current_path}" -w 70% -h 80% -E \
    "$HOME/projects/github/accessd/draw-prompt/bin/draw-prompt open"; \
  rm -f "$tmpfile"'

# Paste the latest screenshot full path
bind-key -n M-0 run-shell -b '\
  latest=$(ls -t "$HOME"/Pictures/screenshots/*.png 2>/dev/null | head -1); \
  if [ -n "$latest" ]; then \
    tmux send-keys -t "#{pane_id}" -l "$latest "; \
  else \
    tmux display-message "no screenshots found"; \
  fi'

set-option -g set-titles on
set-option -g set-titles-string "#{session_name}"

set -g @copycat_file_search 'C-t'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'thuantanphamfilms/tmux-fzf-session-switch'
set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin 'accessd/tmux-agent-indicator'
set -g @plugin 'tmux-plugins/tmux-copycat'
# set -g @plugin 'jtmcginty/tmux-session-dots'

set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @minimal-tmux-status-right '#{agent_session_dots} #{agent_limits} #(gitmux -cfg $HOME/.gitmux.conf "#{pane_current_path}")'
set -g @minimal-tmux-justify "left"

run '~/.tmux/plugins/tpm/tpm'

# Agent team layout for Claude Code multi-agent workflows
set -g @center_width 120
run-shell '~/.tmux/tmux-agent-layout/agent-layout.tmux'

# set -g @session-dots-active "🌕"
# set -g @session-dots-inactive "🌑"
# set -g @session-dots-color "#89b4fa"  # Catppuccin blue


set -g @agent-indicator-notification-enabled 'off'
set -g @agent-indicator-animation-enabled 'on'
set -g @agent-indicator-needs-input-bg 'colour29'
set -g @agent-indicator-done-bg 'colour22'

set -g @agent-indicator-session-dots-active '🌕'
set -g @agent-indicator-session-dots-inactive '🌑'
set -g @agent-indicator-session-dots-attention '🤖'
set -g @agent-indicator-session-dots-attention-color 'red'

set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#BF616A,bold"
set -g pane-border-lines "heavy"

set -g allow-passthrough all
set -g pane-border-indicators arrows

set -g @fzf-goto-session-only 'true'
