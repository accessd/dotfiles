---
- hosts: all
  vars:
    # yabai/skhd/sketchybar are macOS-only, and hal9000 opts out even there.
    macos_desktop: >-
      {{ (ansible_system == 'Darwin')
         and ((configure_window_manager | default(true)) | bool) }}
  tasks:
    # tmux plugin manager (tpm)
    - name: Create ~/.tmux/plugins directory
      file: path=~/.tmux/plugins state=directory

    - name: Clone tmux plugin manager (tpm)
      git:
        repo: https://github.com/tmux-plugins/tpm
        dest: ~/.tmux/plugins/tpm
        force: yes

    - name: Install tmux plugins
      shell: ~/.tmux/plugins/tpm/bin/install_plugins
      register: tpm_install
      changed_when: "'download success' in tpm_install.stdout"
      ignore_errors: yes

    # zsh configuration
    - name: Clone zsh-z
      git:
        repo: https://github.com/agkozak/zsh-z
        dest: ~/.zsh-z
        depth: 1
        force: yes

    - name: Remove stale zsh-z copy in ~/bin
      file: path=~/bin/zsh-z.plugin.zsh state=absent

    - file: src={{ curdir }}/files/zshrc dest=~/.zshrc state=link force=true

    - name: Create ~/.zsh.after directory
      file: path=~/.zsh.after state=directory

    - name: Symlink zsh files into ~/.zsh.after
      file:
        src: "{{ item }}"
        dest: "~/.zsh.after/{{ item | basename }}"
        state: link
        force: true
      with_fileglob: "{{ curdir }}/files/zsh/*.zsh"

    # bin directory
    - name: Create ~/bin directory
      file: path=~/bin state=directory

    - name: Copy bin files to ~/bin
      copy: src={{ curdir }}/files/bin/ dest=~/bin/ mode=preserve

    # neovim configuration
    - name: Create ~/.config directory
      file: path=~/.config state=directory

    - name: Create agent work directories
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - ~/projects
        - ~/logs/agents
        - ~/worktrees

    - name: Create mise config directory
      file: path=~/.config/mise state=directory

    - name: Create mise config symlink
      file: src={{ curdir }}/files/mise/config.toml dest=~/.config/mise/config.toml state=link force=true

    - name: Create Caddy config directory
      file: path=~/.config/caddy state=directory

    - name: Create pi-super Caddy config symlink
      file: src={{ curdir }}/files/caddy/pi-super.Caddyfile dest=~/.config/caddy/pi-super.Caddyfile state=link force=true

    - name: Create neovim config symlink
      file: src={{ curdir }}/nvim dest=~/.config/nvim state=link force=true

    # other configuration files
    # - file: src={{ curdir }}/files/sshrc dest=~/.sshrc state=link
    - file: src={{ curdir }}/files/tmux.conf dest=~/.tmux.conf state=link force=true

    - name: Create tmux-agent-layout symlink
      file:
        src: "{{ curdir }}/files/tmux-agent-layout"
        dest: ~/.tmux/tmux-agent-layout
        state: link
        force: true
    - name: Create skhd config symlink
      file: src={{ curdir }}/files/skhdrc dest=~/.skhdrc state=link force=true
      when: macos_desktop | bool

    - name: Create yabai config symlink
      file: src={{ curdir }}/files/yabairc dest=~/.yabairc state=link force=true
      when: macos_desktop | bool

    - file: src={{ curdir }}/files/gitconfig dest=~/.gitconfig state=link force=true
    - file: src={{ curdir }}/files/gitignore dest=~/.gitignore state=link force=true
    - file: src={{ curdir }}/files/wezterm.lua dest=~/.wezterm.lua state=link force=true

    - name: Create sketchybar config symlink
      file: src={{ curdir }}/files/sketchybar dest=~/.config/sketchybar state=link force=true
      when: macos_desktop | bool

    - name: Remove window manager configs when disabled
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - ~/.skhdrc
        - ~/.yabairc
        - ~/.config/sketchybar
      when: not (macos_desktop | bool)

    # karabiner configuration (macOS keyboard remapper)
    - name: Create ~/.config/karabiner directory
      file: path=~/.config/karabiner state=directory
      when: ansible_system == 'Darwin'
    - file: src={{ curdir }}/files/karabiner.json dest=~/.config/karabiner/karabiner.json state=link force=true
      when: ansible_system == 'Darwin'

    # - name: Create ~/.sshrc.d
    #   file: path=~/.sshrc.d state=directory
    #
    # - file: src={{ curdir }}/files/{{ item }} dest=~/.sshrc.d/{{ item }} state=link
    #   with_items:
    #     - LS_COLORS
